<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <title>Document</title>
</head>

<body class="bg-slate-950">
    <nav class="w-full h-14 bg-indigo-200 flex justify-between px-4 md:px-4 items-center relative">
        <div class="text-2xl text-indigo-700 font-bold">PW Skills</div>

        <!-- Desktop menu -->
        <ul class="md:flex font-semibold hidden gap-2" id="menu">
            <li class="m-2.5 cursor-pointer">Home</li>
            <li class="m-2.5 cursor-pointer">About Us</li>
            <li class="m-2.5 cursor-pointer">Contact Us</li>
        </ul>

        <div class="hidden md:block px-2 py-2 bg-indigo-700 text-white rounded font-bold cursor-pointer">Login/Signup
        </div>

        <div class="md:hidden">
            <a class="text-2xl" href="#" id="menuBtn"><i class="fa-solid fa-bars"></i></a>
        </div>

        <!-- Mobile dropdown menu -->
        <ul id="mobileMenu"
            class="md:hidden absolute top-14 left-0 w-full bg-indigo-200 font-semibold flex flex-col overflow-hidden max-h-0 opacity-0 transition-all duration-300 ease-in-out">
            <li class="m-2.5 cursor-pointer">Home</li>
            <li class="m-2.5 cursor-pointer">About Us</li>
            <li class="m-2.5 cursor-pointer">Contact Us</li>
        </ul>
    </nav>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        let isOpen = false;

        menuBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isOpen = !isOpen;
            if (isOpen) {
                mobileMenu.classList.remove('max-h-0', 'opacity-0');
                mobileMenu.classList.add('max-h-60', 'opacity-100');
            } else {
                mobileMenu.classList.remove('max-h-60', 'opacity-100');
                mobileMenu.classList.add('max-h-0', 'opacity-0');
            }
        });
    </script>
</body>

</html>
